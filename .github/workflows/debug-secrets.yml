name: Debug secrets
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "FTP_SERVER length: ${#S}"
          echo "FTP_USERNAME length: ${#U}"
          echo "FTP_PASSWORD length: ${#P}"
