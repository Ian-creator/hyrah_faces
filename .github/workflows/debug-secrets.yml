name: Debug secrets
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          VS: ${{ vars.FTP_SERVER }}
          VU: ${{ vars.FTP_USERNAME }}
          VP: ${{ vars.FTP_PASSWORD }}
          IF: ${{ secrets.INFINITY_FREE }}
        run: |
          echo "secret FTP_SERVER length: ${#S}"
          echo "secret FTP_USERNAME length: ${#U}"
          echo "secret FTP_PASSWORD length: ${#P}"
          echo "var FTP_SERVER length: ${#VS}"
          echo "var FTP_USERNAME length: ${#VU}"
          echo "var FTP_PASSWORD length: ${#VP}"
          echo "secret INFINITY_FREE length: ${#IF}"
          echo "secret names available:"
          echo '${{ toJSON(secrets) }}' | tr ',' '\n' | sed 's/:.*/: <redacted>/'
